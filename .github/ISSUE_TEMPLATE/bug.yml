name: Bug report
description: Report a non-sensitive problem using disposable fixtures.
body:
  - type: markdown
    attributes:
      value: Do not publish credentials, personal information, wallet exports, real account/transaction details or raw logs. Follow SECURITY.md for sensitive reports. Never use real funds for reproduction.
  - type: input
    id: source
    attributes:
      label: Source or artifact identity
      description: Commit/tree or release-manifest identity.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment versions
      description: OS, browser, Node and wallet versions where applicable. Omit account and machine identities.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Fixture-only reproduction and expected result
      description: Give exact steps and actual versus expected behavior with public disposable fixtures. State missing prerequisites and test skips.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Safe public evidence
      options:
        - label: This report contains only English, sanitized fixture evidence and no private or sensitive material.
          required: true
